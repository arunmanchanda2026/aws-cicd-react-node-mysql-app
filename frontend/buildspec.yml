version: 0.2

env:
  variables:
    VITE_API_URL: "/api"
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Navigating to the frontend directory...
      - cd frontend
      - echo Installing dependencies...
      - npm install
  pre_build:
    commands:
      - echo "Creating .env file in frontend directory..."
      - echo "VITE_API_URL='$VITE_API_URL'" > .env
      - echo "Environment variables have been saved to .env"
  build:
    commands:
      - echo Building the React app...
      - npm run build
  post_build:
    commands:
      - echo Build completed. Searching for appspec.yml...
      - |
        if [ -f "../appspec.yml" ]; then
          cp ../appspec.yml dist/;
          cp -R ../scripts/ dist/;
          echo "Copied configuration from repository root.";
        elif [ -f "appspec.yml" ]; then
          cp appspec.yml dist/;
          cp -R scripts/ dist/;
          echo "Copied configuration from frontend directory.";
        else
          echo "CRITICAL ERROR: appspec.yml not found!";
          echo "Showing current directory contents:";
          ls -la;
          echo "Showing parent directory contents:";
          ls -la ..;
          exit 1;
        fi

artifacts:
  files:
    - '**/*'
  base-directory: frontend/dist
  discard-paths: no
cache:
  paths:
    - frontend/node_modules/**/*
