version: 0.2

env:
  variables:
    VITE_API_URL: "/api"
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Navigating to the frontend directory...
      - cd frontend
      - echo Installing dependencies...
      - npm install
  pre_build:
    commands:
      - echo "Creating .env file in frontend directory..."
      - echo "VITE_API_URL='$VITE_API_URL'" > .env
      - echo "Environment variables have been saved to .env"
  build:
    commands:
      - echo Building the React app...
      - npm run build
  post_build:
    commands:
      - echo Build completed. Preparing artifacts for deployment
      - echo Copying appspec.yml from root to dist directory...
      - cp ../appspec.yml dist/
      - echo Copying scripts directory from root to dist directory...
      - cp -R ../scripts/ dist/
artifacts:
  files:
    - '**/*'
  base-directory: frontend/dist
  discard-paths: no
cache:
  paths:
    - frontend/node_modules/**/*
